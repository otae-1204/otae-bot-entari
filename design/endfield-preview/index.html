<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>ENDFIELD / OTAE · 全页面代码预览</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <aside class="review-sidebar" aria-label="设计评审导航">
      <a class="review-brand" href="#operator"
        ><span class="brand-mark">◆</span>
        <div>ENDFIELD<span>OTAE / DESIGN ARCHIVE</span></div></a
      >
      <div class="review-intro">
        代码预览 / 非正式界面<br />所有页面使用示例数据，不连接账号。
      </div>
      <label class="review-search"
        >查找页面<input
          id="page-search"
          type="search"
          placeholder="干员、配装、回响…"
      /></label>
      <nav id="page-nav" aria-label="全部预览页面"></nav>
      <p class="review-disclaimer">
        原生 HTML · CSS · JavaScript<br />没有 AI 生成图片 / 没有插件接入
      </p>
    </aside>
    <main class="review-workspace">
      <header class="review-toolbar">
        <div>
          <span class="live-dot"></span
          ><strong id="review-title">加载预览</strong
          ><small id="page-count"></small>
        </div>
        <div class="review-actions">
          <button id="previous" aria-label="上一页">←</button
          ><button id="next" aria-label="下一页">→</button
          ><a id="capture-link" target="_blank" rel="noopener">纯净预览 ↗</a>
        </div>
      </header>
      <section class="preview-mat" aria-label="页面设计稿">
        <div id="canvas-wrap"><article id="artboard"></article></div>
      </section>
      <footer class="review-footnote">
        画布中的命令仅作排版示例，不会执行。左右方向键切换页面；独立链接可分享当前页面。
      </footer>
    </main>
    <script type="module" src="./src/app.js"></script>
  </body>
</html>
